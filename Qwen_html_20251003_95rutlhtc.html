<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buon Compleanno AK-47 <3 </title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 90%;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 3rem;
      color: #ff6b6b;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.5rem;
      color: #555;
      line-height: 1.6;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f00;
      opacity: 0.7;
      animation: fall linear forwards;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 Buon Compleanno! 🎉</h1>
    <p>Che questo giorno sia pieno di sorrisi,<br>abbracci, dolci e tanti auguri sinceri!</p>
    <p><strong>Tanti auguri da chi ti vuole bene!</strong></p>
  </div>

  <script>
    // Crea coriandoli animati
    function createConfetti() {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      const container = document.body;

      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
        confetti.style.width = (Math.random() * 10 + 5) + 'px';
        confetti.style.height = confetti.style.width;
        container.appendChild(confetti);

        // Rimuovi il coriandolo dopo l'animazione
        setTimeout(() => {
          confetti.remove();
        }, 5000);
      }
    }

    // Avvia i coriandoli all'avvio
    window.onload = createConfetti;
  </script>

</body>
</html>
